<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d2b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a0a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8860a" />
      <stop offset="40%" style="stop-color:#e8a020" />
      <stop offset="100%" style="stop-color:#a06008" />
    </linearGradient>
    <linearGradient id="bodyShine" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="neckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5a3a10" />
      <stop offset="50%" style="stop-color:#7a5018" />
      <stop offset="100%" style="stop-color:#4a2e0a" />
    </linearGradient>
    <linearGradient id="glowBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stringGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#7b2ff7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:0" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="centerGlow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" style="stop-color:#7b2ff7;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:0" />
    </radialGradient>
    <clipPath id="roundRect">
      <rect width="512" height="512" rx="110" ry="110"/>
    </clipPath>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines background -->
  <g opacity="0.06" clip-path="url(#roundRect)">
    <line x1="0" y1="128" x2="512" y2="128" stroke="#00d4ff" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="#00d4ff" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="#00d4ff" stroke-width="1"/>
    <line x1="128" y1="0" x2="128" y2="512" stroke="#00d4ff" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="#00d4ff" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="#00d4ff" stroke-width="1"/>
  </g>

  <!-- Center glow -->
  <ellipse cx="256" cy="300" rx="200" ry="180" fill="url(#centerGlow)"/>

  <!-- === GUITAR BODY === -->
  <!-- Body shadow -->
  <ellipse cx="262" cy="348" rx="128" ry="112" fill="#000" opacity="0.4"/>

  <!-- Lower bout -->
  <ellipse cx="256" cy="340" rx="124" ry="108" fill="url(#bodyGrad)"/>
  <!-- Upper bout -->
  <ellipse cx="256" cy="228" rx="96" ry="84" fill="url(#bodyGrad)"/>
  <!-- Waist connector -->
  <rect x="174" y="240" width="164" height="80" fill="url(#bodyGrad)"/>

  <!-- Waist cutouts -->
  <ellipse cx="185" cy="278" rx="26" ry="40" fill="url(#bgGrad)"/>
  <ellipse cx="327" cy="278" rx="26" ry="40" fill="url(#bgGrad)"/>

  <!-- Body shine overlay -->
  <ellipse cx="256" cy="340" rx="124" ry="108" fill="url(#bodyShine)"/>
  <ellipse cx="256" cy="228" rx="96" ry="84" fill="url(#bodyShine)"/>

  <!-- Body outline -->
  <ellipse cx="256" cy="340" rx="124" ry="108" fill="none" stroke="#f0c040" stroke-width="2" opacity="0.5"/>
  <ellipse cx="256" cy="228" rx="96" ry="84" fill="none" stroke="#f0c040" stroke-width="2" opacity="0.5"/>

  <!-- Sound hole -->
  <circle cx="256" cy="310" r="46" fill="#0d0d1e" stroke="#c8860a" stroke-width="3"/>
  <circle cx="256" cy="310" r="42" fill="none" stroke="#e8a020" stroke-width="1" opacity="0.5"/>
  <circle cx="256" cy="310" r="34" fill="none" stroke="#c8860a" stroke-width="1" opacity="0.3"/>

  <!-- Sound hole glow rings -->
  <circle cx="256" cy="310" r="46" fill="none" stroke="url(#glowBlue)" stroke-width="2" opacity="0.6" filter="url(#softGlow)"/>

  <!-- === NECK === -->
  <rect x="238" y="60" width="36" height="200" rx="8" fill="url(#neckGrad)"/>
  <rect x="240" y="60" width="4" height="200" rx="2" fill="#8a6020" opacity="0.5"/>
  <!-- Fret lines -->
  <line x1="238" y1="120" x2="274" y2="120" stroke="#c8a050" stroke-width="2" opacity="0.7"/>
  <line x1="238" y1="152" x2="274" y2="152" stroke="#c8a050" stroke-width="2" opacity="0.7"/>
  <line x1="238" y1="180" x2="274" y2="180" stroke="#c8a050" stroke-width="2" opacity="0.7"/>
  <line x1="238" y1="205" x2="274" y2="205" stroke="#c8a050" stroke-width="2" opacity="0.7"/>

  <!-- Neck binding -->
  <rect x="238" y="60" width="36" height="200" rx="8" fill="none" stroke="#e8c070" stroke-width="1.5" opacity="0.4"/>

  <!-- === HEADSTOCK === -->
  <rect x="234" y="40" width="44" height="42" rx="6" fill="#3a2208"/>
  <rect x="232" y="36" width="48" height="28" rx="8" fill="#4a2e0a"/>
  <rect x="232" y="36" width="48" height="28" rx="8" fill="none" stroke="#8a6020" stroke-width="1.5" opacity="0.6"/>
  <!-- Tuning pegs -->
  <circle cx="243" cy="42" r="5" fill="#888" stroke="#aaa" stroke-width="1"/>
  <circle cx="256" cy="42" r="5" fill="#888" stroke="#aaa" stroke-width="1"/>
  <circle cx="269" cy="42" r="5" fill="#888" stroke="#aaa" stroke-width="1"/>

  <!-- === GLOWING STRINGS === -->
  <g filter="url(#glow)">
    <line x1="244" y1="50" x2="222" y2="440" stroke="url(#stringGlow)" stroke-width="2.5" opacity="0.95"/>
    <line x1="250" y1="50" x2="238" y2="440" stroke="url(#stringGlow)" stroke-width="2" opacity="0.85"/>
    <line x1="256" y1="50" x2="254" y2="440" stroke="url(#stringGlow)" stroke-width="1.8" opacity="0.9"/>
    <line x1="262" y1="50" x2="270" y2="440" stroke="url(#stringGlow)" stroke-width="1.8" opacity="0.85"/>
    <line x1="268" y1="50" x2="286" y2="440" stroke="url(#stringGlow)" stroke-width="2" opacity="0.85"/>
    <line x1="274" y1="50" x2="302" y2="440" stroke="url(#stringGlow)" stroke-width="2.5" opacity="0.95"/>
  </g>

  <!-- === NOTE DOTS on strings (fret markers) === -->
  <g filter="url(#softGlow)">
    <!-- Fret 1 dot on string 2 -->
    <circle cx="242" cy="135" r="7" fill="#00d4ff" opacity="0.9"/>
    <text x="242" y="139" text-anchor="middle" font-size="8" font-weight="bold" fill="#0a0a2a" font-family="monospace">0</text>

    <!-- Fret 3 dot on string 4 -->
    <circle cx="258" cy="163" r="7" fill="#7b2ff7" opacity="0.9"/>
    <text x="258" y="167" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff" font-family="monospace">3</text>

    <!-- Fret 2 dot on string 5 -->
    <circle cx="266" cy="148" r="7" fill="#00d4ff" opacity="0.9"/>
    <text x="266" y="152" text-anchor="middle" font-size="8" font-weight="bold" fill="#0a0a2a" font-family="monospace">2</text>
  </g>

  <!-- === WAVEFORM / EQ BARS at bottom === -->
  <g filter="url(#softGlow)" opacity="0.85">
    <!-- Wave bars suggesting audio/bounce -->
    <rect x="90" y="430" width="10" height="28" rx="5" fill="url(#glowBlue)"/>
    <rect x="106" y="420" width="10" height="38" rx="5" fill="url(#glowBlue)"/>
    <rect x="122" y="436" width="10" height="22" rx="5" fill="url(#glowBlue)"/>
    <rect x="138" y="414" width="10" height="44" rx="5" fill="url(#glowBlue)"/>
    <rect x="154" y="426" width="10" height="32" rx="5" fill="url(#glowBlue)"/>
    <rect x="170" y="438" width="10" height="20" rx="5" fill="url(#glowBlue)"/>

    <rect x="332" y="438" width="10" height="20" rx="5" fill="url(#glowBlue)"/>
    <rect x="348" y="426" width="10" height="32" rx="5" fill="url(#glowBlue)"/>
    <rect x="364" y="414" width="10" height="44" rx="5" fill="url(#glowBlue)"/>
    <rect x="380" y="436" width="10" height="22" rx="5" fill="url(#glowBlue)"/>
    <rect x="396" y="420" width="10" height="38" rx="5" fill="url(#glowBlue)"/>
    <rect x="412" y="430" width="10" height="28" rx="5" fill="url(#glowBlue)"/>
  </g>

  <!-- === "TB" brand mark inside sound hole === -->
  <text x="256" y="318" text-anchor="middle" font-size="22" font-weight="900" fill="url(#glowBlue)" font-family="monospace" filter="url(#softGlow)" opacity="0.9">TB</text>

  <!-- Outer border glow -->
  <rect width="512" height="512" rx="110" ry="110" fill="none" stroke="url(#glowBlue)" stroke-width="3" opacity="0.4"/>
  <rect width="512" height="512" rx="110" ry="110" fill="none" stroke="url(#glowBlue)" stroke-width="8" opacity="0.12" filter="url(#outerGlow)"/>
</svg>
